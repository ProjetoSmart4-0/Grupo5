
name: Validar contrato OpenAPI

on:
  push:
    paths:
      - "contracts/openapi-spec.yaml"
      - ".github/workflows/validate-openapi.yml"
  pull_request:
    paths:
      - "contracts/openapi-spec.yaml"
      - ".github/workflows/validate-openapi.yml"

jobs:
  validar-openapi:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar contrato OpenAPI
        run: npx --yes @redocly/cli@1.34.5 lint contracts/openapi-spec.yaml
